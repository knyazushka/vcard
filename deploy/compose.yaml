# Прод: один сервер — Caddy перед API, одноразовый migrator
# и мониторинг (Prometheus + Grafana).
#
# Всё важное состояние — вне сервера: база управляемая, файлы в S3.
# На диске только сертификаты Caddy и история метрик — их потеря
# неприятна, но не страшна. Сервер можно пересоздать с нуля и выкатить
# заново.
#
# Файлы рядом кладёт CI при каждой выкатке, руками здесь ничего не правят:
#   .env         — IMAGE, API_DOMAIN и WEB_DOMAIN для подстановки в этот файл;
#   app.env      — конфигурация приложения из GitHub Secrets и Variables;
#   grafana.env  — пароль администратора Grafana.
#
# Конфиги монтируются каталогами, а не файлами: выкатка заменяет файл
# новым, и смонтированный по отдельности файл остался бы в контейнере
# старым.

name: vcard

x-logging: &logging
  # По умолчанию json-file растёт без предела и рано или поздно съедает диск.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: ${IMAGE:?IMAGE is not set}
  env_file:
    - path: app.env
      # Значения берутся как есть. Без raw compose раскрывал бы в них
      # $ и кавычки, и пароль с долларом молча превращался бы в другой.
      format: raw
  # То, что следует из устройства стенда, а не из настроек окружения,
  # живёт здесь, рядом с самим устройством.
  environment:
    APP_ENV: production
    LOG_LEVEL: info
    HTTP_ADDR: ":8080"
    HTTP_ADMIN_ADDR: ":9090"
    # До api можно достучаться только через Caddy: порт 8080 наружу
    # не опубликован, а Caddy сам выставляет X-Forwarded-For и X-Request-Id.
    TRUST_PROXY_HEADERS: "true"
    STORAGE_DRIVER: s3
  logging: *logging

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is not set}
      # Фронт — отдельный compose-проект (vcard-web), подключённый к сети
      # этого, vcard_default; его домен обслуживает этот же Caddy.
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is not set}
    volumes:
      - ./caddy:/etc/caddy:ro
      # Без тома сертификаты выпускались бы заново на каждом перезапуске,
      # и лимиты Let's Encrypt кончились бы за пару неудачных выкаток.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  api:
    <<: *app
    restart: unless-stopped
    ports:
      # Пробы и метрики — только на localhost сервера: снаружи недоступны,
      # а скрипт выкатки проверяет по ним готовность нового процесса.
      - "127.0.0.1:9090:9090"
    stop_grace_period: 20s # больше HTTP_SHUTDOWN_TIMEOUT, чтобы остановка успела

  # Шаг релиза, а не сервис: профиль не даёт ему стартовать от `up`,
  # запускается явно — `docker compose run --rm migrator`.
  migrator:
    <<: *app
    entrypoint: ["/usr/local/bin/migrator"]
    profiles: [release]

  # Мониторинг живёт на том же сервере: отдельная машина ради одного
  # процесса стоила бы дороже, чем он сам. Лимиты памяти — чтобы при
  # всплеске метрики не отняли память у api.
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    env_file:
      - path: grafana.env
        format: raw
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # Только localhost: вход через SSH-туннель, без публичной админки,
      # отдельного домена и сертификата. См. docs/operations.md.
      - "127.0.0.1:3000:3000"
    volumes:
      # Подкаталогами, а не весь provisioning: иначе пропадают пустые
      # plugins/ и alerting/ из образа, и Grafana ругается на каждом старте.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 512m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
